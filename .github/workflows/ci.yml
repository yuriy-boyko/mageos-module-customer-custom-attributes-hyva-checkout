name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: PHP syntax, XML and JSON (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
      - name: Checks
        run: dev/check.sh
